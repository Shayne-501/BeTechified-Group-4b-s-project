<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="stylesheet" href="theme.css" />

<body>
    <div class="container">
        <h2>Login</h2>

        </form>
        <div id="message"></div>
        <p style="margin-top:12px;color:inherit">New here? <a href="1st_infopg.html" style="color:limegreen;">Sign
                up</a>
        </p>
    </div>

    <script src="login.js"></script>
</body>

</html>
