<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Multi-User Login/Signup</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="login_signup.css" />
</head>

<body>
    <div class="container">
        <h2>Login / Signup</h2>
        <form id="athForm">
            <div class="toggle-row">
                <label>
                    <input type="checkbox" id="toggleCEO" /> Are you the CEO [Enable Owner/CEO option]
                </label>
            </div>

            <select id="userType" title="Select User Type">
                <!-- CEO option is disabled by default; the checkbox above will enable/disable it -->
                <option id="ceoOption" value="CEO" disabled>Owner/CEO</option>
                <option value="staff">Staff</option>
            </select>

            <input type="text" id="username" placeholder="Username" required />
            <input type="password" id="password" placeholder="Password" required />

            <button type="submit">Login / Signup</button>
        </form>
        <div id="message"></div>
    </div>

    <script src="login_signup.js"></script>
</body>

</html>
