<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Info</title>
    <link rel="stylesheet" href="theme.css" />
</head>

<body>
    <main class="container page-center">
        <h1>Hi — let’s get to know you</h1>
        <form id="infoForm">
            <div>
                <label><strong>What can we call you, for short?</strong></label>
                <br>
                <input type="radio" name="title" value="Miss"> Miss
                <input type="radio" name="title" value="Mrs"> Mrs
                <input type="radio" name="title" value="Mr"> Mr
                <br>
                <input type="text" name="shortName" placeholder="e.g. Anna" required />
            </div>

            <br>
            <div>
                <label><strong>Your full name</strong></label>
                <br>
                <input type="text" name="fullName" placeholder="Full name" />
            </div>

            <div>
                <label><strong>Your Gender</strong></label>
                <br>
                <input type="radio" name="gender" value="Male"> Male
                <input type="radio" name="gender" value="Female"> Female
                <input type="radio" name="gender" value="Non-binary"> Non-binary
                <input type="radio" name="gender" value="Prefer not to tell"> Prefer not to tell
            </div>

            <br>
            <div>
                <label><strong>Choose a label size</strong></label>
                <select name="size">
                    <option value="">Please choose</option>
                    <option value="small">Small (S)</option>
                    <option value="medium">Medium (M)</option>
                    <option value="large" selected>Large (L)</option>
                    <option value="xl">Extra Large (XL)</option>
                </select>
            </div>

            <textarea name="notes" rows="5" cols="50" placeholder="Anything else you'd like to let us know?"></textarea>
            <button type="submit">All done!</button>
        </form>
    </main>
    <script>
        const form = document.getElementById('infoForm');

        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const formData = new FormData(form);
            const info = {
                title: formData.get('title'),
                shortName: formData.get('shortName'),
                fullName: formData.get('fullName'),
                gender: formData.get('gender'),
                size: formData.get('size'),
                notes: formData.get('notes')
            };

            // Load current user
            const current = JSON.parse(localStorage.getItem('aseda_current_user') || 'null');
            if (!current) {
                alert('Session expired. Please log in again.');
                window.location.href = 'login.html';
                return;
            }

            // Load users and update the current user's info
            const users = JSON.parse(localStorage.getItem('aseda_users') || '{}');
            const userList = users[current.userType] || [];
            const userIndex = userList.findIndex(u => u.username === current.username);
            if (userIndex !== -1) {
                userList[userIndex].info = info;
                localStorage.setItem('aseda_users', JSON.stringify(users));
            }

            // Redirect to Aseda FP
            window.location.href = 'Aseda FP.html';
        });
    </script>
</body>

</html>
